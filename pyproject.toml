[build-system]
requires = [
    "setuptools>=61,<83; python_version < '3.10'",
    "setuptools>=83,<84; python_version >= '3.10'",
    "wheel>=0.38,<1",
]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
branch = true
relative_files = true
source = ["unicorefw"]

[tool.coverage.report]
fail_under = 83.0
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "database_integration: requires dedicated loopback PostgreSQL and MySQL services",
    "redis_integration: requires a dedicated loopback Redis service",
]
