name: CodeQL Security Analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "23 4 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Python security-extended queries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: python
          queries: security-extended

      - name: Analyze without bypassing the local severity gate
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:python
          output: codeql-results
          upload: ${{ startsWith(github.ref, 'refs/tags/') && 'never' || 'failure-only' }}

      - name: Reject unsuppressed medium and high findings
        run: >-
          python scripts/verify_security_policy.py sarif
          --input codeql-results
          --suppressions security/suppressions.json
          --minimum-severity 4

      - name: Upload CodeQL results
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: codeql-results
          category: /language:python
