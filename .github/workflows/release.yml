name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Required quality gates
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build and verify immutable artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tag, metadata, and changelog agreement
        run: python scripts/verify_release.py "${{ github.ref_name }}"

      - name: Install isolated build verification tools
        run: python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Build wheel and source distribution through PEP 517
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Inspect and smoke-test the wheel in an isolated environment
        run: python scripts/verify_wheel.py dist/*.whl

      - name: Generate checksums, release manifest, and CycloneDX SBOM
        run: >-
          python scripts/build_release_metadata.py
          --dist-dir dist
          --output-dir release-metadata
          --version "${{ github.ref_name }}"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/
            release-metadata/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/unicorefw
    permissions:
      id-token: write

    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-candidate

      - name: Publish distributions and provenance attestations
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
        with:
          packages-dir: release-candidate/dist/
          attestations: true
